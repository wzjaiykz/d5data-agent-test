[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "d5data-agent-audit"
version = "0.1.0"
description = "Reproducible audit of the supplied restaurant traffic Agent evaluation package"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "openpyxl==3.1.5",
]

[project.optional-dependencies]
test = [
  "pytest==8.3.4",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -p no:cacheprovider"
